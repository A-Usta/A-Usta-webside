name: A-USTA Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/a-usta56/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/a-usta56/**"
      - ".github/workflows/main.yml"

jobs:
  backend-ci:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/a-usta56

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build
