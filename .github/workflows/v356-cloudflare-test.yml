name: V356 Cloudflare TEST map
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Workers SQLite and proxy security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/geoapify/cloudflare
      - run: npm test
        working-directory: tools/geoapify/cloudflare
      - run: git diff --exit-code
  live:
    name: Explicit manual real TEST map QA
    if: github.event_name == 'workflow_dispatch' && github.repository == 'A-Usta/A-Usta-webside' && github.ref == 'refs/heads/feat/v356-live-automotive-map'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: tests
      - name: Bounded live QA, no provider key in CI
        env:
          AUSTA_CF_LIVE_APPROVED: YES_TEST_ONLY
          AUSTA_CF_EVIDENCE: ${{ runner.temp }}/cf-map-evidence
        run: node tools/geoapify/cloudflare/live-qa.cjs
      - name: Upload key-free live evidence, including honest failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-live-map-evidence
          path: ${{ runner.temp }}/cf-map-evidence
          if-no-files-found: ignore
          retention-days: 7
