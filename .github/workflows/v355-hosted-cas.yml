name: V355 approved TEST CAS withdrawal
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed HEAD on the selected TEST feature branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v355-hosted-cas-xnhxneziasqthkhhntkv
  cancel-in-progress: false
jobs:
  review:
    permissions:
      contents: read
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'A-Usta/A-Usta-webside' &&
      github.ref == 'refs/heads/feat/v355-automotive-map' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Verify protected TEST environment exists before credential use
        env:
          AUSTA_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 -I -B tests/hosted/check_environment.py
      - name: Install pinned test-only PostgreSQL driver
        run: |
          python3 -m venv "$RUNNER_TEMP/austa-hosted-venv"
          "$RUNNER_TEMP/austa-hosted-venv/bin/python" -m pip install psycopg2-binary==2.9.13
      - name: Offline security contracts, no credentials
        run: '"$RUNNER_TEMP/austa-hosted-venv/bin/python" -I -B -m unittest discover -s tests/hosted -p test_security.py -v'
  hosted:
    needs: review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'A-Usta/A-Usta-webside' &&
      github.ref == 'refs/heads/feat/v355-automotive-map' &&
      inputs.approved_sha == github.sha
    environment: austa-test-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Install pinned PostgreSQL driver before secrets enter a process
        run: |
          python3 -m venv "$RUNNER_TEMP/austa-hosted-venv"
          "$RUNNER_TEMP/austa-hosted-venv/bin/python" -m pip install psycopg2-binary==2.9.13
      - name: One approved withdrawal, preserve all records
        env:
          AUSTA_TEST_ENVIRONMENT: austa-test-only
          AUSTA_APPROVED_SHA: ${{ inputs.approved_sha }}
          AUSTA_TEST_DB_PASSWORD: ${{ secrets.AUSTA_TEST_DB_PASSWORD }}
          AUSTA_TEST_DB_CA_PEM: ${{ secrets.AUSTA_TEST_DB_CA_PEM }}
        run: '"$RUNNER_TEMP/austa-hosted-venv/bin/python" -I -B tests/hosted/run_cas.py'

  geoapify:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'A-Usta/A-Usta-webside' &&
      github.ref == 'refs/heads/feat/v356-live-automotive-map' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - name: Install reviewed browser tooling without live credentials
        run: npm ci --prefix tests
      - name: Install Chromium without live credentials
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Offline security and public artifact review
        run: |
          node --test tests/geoapify-manual-live.test.cjs
          node tools/geoapify/preview.cjs "$RUNNER_TEMP/austa-geo-public"
      - name: Bounded live integration, encrypted repository secrets only
        env:
          AUSTA_APPROVED_SHA: ${{ inputs.approved_sha }}
          GEOAPIFY_BROWSER_KEY: ${{ secrets.GEOAPIFY_BROWSER_KEY }}
          GEOAPIFY_ALLOWED_ORIGINS: ${{ secrets.GEOAPIFY_ALLOWED_ORIGINS }}
          AUSTA_PUBLIC_REPORT_DIR: ${{ runner.temp }}/austa-geo-public
        run: node tools/geoapify/live.cjs
      - name: Upload only key-free preview and allowlisted result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v356-key-free-map-test
          path: ${{ runner.temp }}/austa-geo-public
          retention-days: 3
          if-no-files-found: error
